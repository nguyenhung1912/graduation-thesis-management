# Port của Report Service trong hệ thống SOA
server.port=8084
spring.application.name=report-service

# Địa chỉ endpoint của Thesis Service (Port 8082)
services.thesis.url=http://localhost:8082

# Cấu hình OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Cấu hình Feign Client Timeout (5 giây kết nối, 10 giây đọc dữ liệu)
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000

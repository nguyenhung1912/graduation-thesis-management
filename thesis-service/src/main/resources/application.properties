# Cổng chạy của Thesis Service
server.port=8082
spring.application.name=thesis-service

# Cấu hình CSDL H2 Database
# spring.datasource.url=jdbc:h2:mem:thesisdb
# cách chạy database cứng 
spring.datasource.url=jdbc:h2:file:./data/thesisdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# UI xem Database trên web
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update